<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Stylized Bookmark / Vault Icon with shadow -->
  <g filter="url(#shadow)">
    <!-- Main Bookmark Ribbon -->
    <path d="M 160 110 C 160 98.95 168.95 90 180 90 L 332 90 C 343.05 90 352 98.95 352 110 L 352 400 C 352 411.3 338.8 417.4 329.8 409.8 L 256 346.5 L 182.2 409.8 C 173.2 417.4 160 411.3 160 400 Z" fill="url(#ribbonGrad)" />

    <!-- Center Link symbol cutout / glyph -->
    <circle cx="256" cy="195" r="28" fill="#2563eb" />
    <path d="M 230 255 L 282 255" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
    <path d="M 240 280 L 272 280" stroke="#2563eb" stroke-width="10" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
